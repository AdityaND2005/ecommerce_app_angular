<div class="home-container">

    <section class="hero-section">
        <img src="/hero-banner.png" alt="hero-banner" class="hero-image" />
    </section>

    @for (category of productMap | keyvalue; track category.key) {
    <app-product-carousel [categoryName]="category.key" [products]="category.value">
    </app-product-carousel>
    }
</div>
