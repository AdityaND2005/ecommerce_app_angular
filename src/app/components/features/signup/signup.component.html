<p-toast key="signupToast" position="top-right"></p-toast>

<div class="signup-wrapper">
    <p-card class="signup-card">

        <div class="form-header">
            <h1>Create an Account</h1>
            <p>Join us to get started</p>
        </div>

        <form [formGroup]="signupForm" class="signup-form">

            <div class="form-row">
                <div class="form-group">
                    <p-floatLabel>
                        <input pInputText id="firstname" formControlName="firstname" />
                        <label for="firstname">First Name</label>
                    </p-floatLabel>
                    <small class="p-error"
                        *ngIf="signupForm.controls['firstname'].invalid && signupForm.controls['firstname'].touched">
                        First name is required (min 2 chars).
                    </small>
                </div>

                <div class="form-group">
                    <p-floatLabel>
                        <input pInputText id="lastname" formControlName="lastname" />
                        <label for="lastname">Last Name</label>
                    </p-floatLabel>
                    <small class="p-error"
                        *ngIf="signupForm.controls['lastname'].invalid && signupForm.controls['lastname'].touched">
                        Last name is required.
                    </small>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <p-floatLabel>
                        <input pInputText id="username" formControlName="username" />
                        <label for="username">Username</label>
                    </p-floatLabel>
                    <small class="p-error"
                        *ngIf="signupForm.controls['username'].invalid && signupForm.controls['username'].touched">
                        Username is required (min 4 chars).
                    </small>
                </div>

                <div class="form-group">
                    <p-floatLabel>
                        <input pInputText id="phone" formControlName="phone" />
                        <label for="phone">Phone Number</label>
                    </p-floatLabel>
                    <small class="p-error"
                        *ngIf="signupForm.controls['phone'].invalid && signupForm.controls['phone'].touched">
                        Valid phone number is required.
                    </small>
                </div>
            </div>

            <div class="form-group">
                <p-floatLabel>
                    <input pInputText id="email" type="email" formControlName="email" />
                    <label for="email">Email Address</label>
                </p-floatLabel>
                <small class="p-error"
                    *ngIf="signupForm.controls['email'].invalid && signupForm.controls['email'].touched">
                    Please enter a valid email.
                </small>
            </div>

            <div class="form-group">
                <p-floatLabel>
                    <p-password id="password" formControlName="password" [toggleMask]="true" [feedback]="true">
                    </p-password>
                    <label for="password">Password</label>
                </p-floatLabel>
                <small class="p-error"
                    *ngIf="signupForm.controls['password'].invalid && signupForm.controls['password'].touched">
                    Password must be at least 6 characters.
                </small>
            </div>

            <p-button label="Sign Up" type="submit" styleClass="submit-btn" [disabled]="signupForm.invalid"
                (click)="onSubmit()">
            </p-button>

        </form>
    </p-card>
</div>
