<div class="product-view-wrapper">
  
  <div class="nav-actions">
    <p-button 
      label="Back" 
      icon="pi pi-arrow-left" 
      [text]="true" 
      severity="secondary"
      (onClick)="goBack()">
    </p-button>
  </div>

  @if (product | async; as p) {
    <div class="product-container">
      
      <div class="product-gallery">
        <div class="main-image-wrapper">
          <img [src]="p.image" [alt]="p.title" class="main-image" />
        </div>
      </div>

      <div class="product-info">
        <p-tag [value]="p.category | uppercase" severity="info" styleClass="category-tag"></p-tag>
        
        <h1 class="product-title">{{ p.title }}</h1>
        
        <div class="rating-badge">
          <i class="pi pi-star-fill star-icon"></i>
          <span class="rate">{{ p.rating.rate }}</span>
          <span class="count">({{ p.rating.count }} reviews)</span>
        </div>

        <div class="price-section">
          <span class="price">{{ p.price | currency }}</span>
        </div>

        <div class="description-section">
          <h3>About this item</h3>
          <p>{{ p.description }}</p>
        </div>

        <div class="action-buttons">
          <p-button 
            label="Add to Cart" 
            icon="pi pi-shopping-cart" 
            styleClass="cart-btn" 
            size="large">
          </p-button>
          <p-button 
            icon="pi pi-heart" 
            styleClass="wishlist-btn" 
            [outlined]="true" 
            severity="secondary" 
            size="large">
          </p-button>
        </div>
      </div>

    </div>
  } @else {
    <div class="loading-state">
      <i class="pi pi-spin pi-spinner" style="font-size: 3rem"></i>
      <p>Loading product details...</p>
    </div>
  }

</div>
